name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No device and no network: the tests bind BACnet/IP (UDP) on free 127.0.0.1
# ports only. Both uv projects commit their uv.lock, so every step runs with
# --locked and fails if pyproject.toml and the lockfile have drifted.
jobs:
  server:
    name: bacnet-python (MCP server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bacnet-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q src

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      # Unit tests, the tool layer through an in-memory MCP session, and an
      # end-to-end run: the mock device (../bacnet-mock-device) and the real
      # server over stdio, driven with the mcp client SDK. The test suite also
      # checks the exact set of registered tools.
      - name: Tests
        run: uv run --locked pytest -v

  mock:
    name: bacnet-mock-device
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bacnet-mock-device
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q bacnet_mock_device.py

      - name: Entry point help
        run: uv run --locked bacnet-mock-device --help

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      # Starts the mock on free 127.0.0.1 ports and drives it with a bacpypes3
      # client; nothing leaves the runner's loopback interface.
      - name: Tests
        run: uv run --locked pytest -v
