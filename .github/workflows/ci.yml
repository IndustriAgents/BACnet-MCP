name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cheap, deterministic checks only: nothing here opens a BACnet/IP socket or
# needs a device. Both uv projects commit their uv.lock, so every step runs
# with --locked and fails if pyproject.toml and the lockfile have drifted.
jobs:
  server:
    name: bacnet-python (MCP server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bacnet-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q src

      # Builds the FastMCP server and lists its tools in-process. This does not
      # run the lifespan, so BAC0 is never started and no UDP port is bound.
      # (`bacnet-mcp` itself has no --help: it starts the stdio server at once.)
      - name: Import BAC0 and the package, and list registered tools
        run: |
          uv run --locked python - <<'EOF'
          import asyncio

          # bacnet_client wraps `import BAC0` in `except Exception: BAC0 = None`,
          # so a broken BACnet stack would only surface at server startup.
          # Import it directly so CI fails here, with the real traceback.
          import BAC0  # noqa: F401

          from bacnet_mcp import bacnet_client
          from bacnet_mcp.cli import main  # noqa: F401  (console entry point imports)
          from bacnet_mcp.server import BACnetMCPServer

          assert bacnet_client.BAC0 is not None, "bacnet_mcp could not import BAC0"

          tools = asyncio.run(BACnetMCPServer()._server.list_tools())
          names = sorted(t.name for t in tools)
          print(f"{len(names)} tools: {', '.join(names)}")
          # The exact set, so a dropped or renamed tool fails CI. Keep this in
          # step with the tool table in README.md.
          expected = [
              "discover_devices",
              "list_objects",
              "ping",
              "read_object_by_alias",
              "read_property",
              "write_object_by_alias",
              "write_property",
          ]
          assert names == expected, names
          EOF

  mock:
    name: bacnet-mock-device
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bacnet-mock-device
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q bacnet_mock_device.py

      - name: Entry point help
        run: uv run --locked bacnet-mock-device --help

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      # Starts the mock on free 127.0.0.1 ports and drives it with a bacpypes3
      # client; nothing leaves the runner's loopback interface.
      - name: Tests
        run: uv run --locked pytest -v
